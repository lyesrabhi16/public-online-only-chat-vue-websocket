# A load balancer in front of two chat servers. The page connects with WebSockets only, so any server can take any visitor
# (no sticky sessions): the servers share the chat through Redis.
events {}

http {
  upstream chat {
    # a server that fails once is left alone for 10 seconds, so a dead one does not slow every visitor down
    server chat1:3000 max_fails=1 fail_timeout=10s;
    server chat2:3000 max_fails=1 fail_timeout=10s;
  }

  # keep the connection open for a WebSocket upgrade, close it for a plain request
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # the real address of the visitor, REPLACED (never appended to what the visitor sent): the servers run with TRUST_PROXY=1
      proxy_set_header X-Forwarded-For $remote_addr;
      # a server that does not answer is given up on quickly, and the visitor goes to the other one
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
      proxy_read_timeout 1h;
    }
  }
}
